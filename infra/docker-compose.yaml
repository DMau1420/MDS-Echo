services:
  postgres-db:
    image: postgres:18
    container_name: mds_postgres
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pg_admin1617
      POSTGRES_DB: mdsecho_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  minio-s3:
    image: minio/minio
    container_name: mds_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=music_admin1617
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
  postgres-db:
